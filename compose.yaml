# Kafka de um unico no (modo KRaft, sem ZooKeeper) para o TDE 03.
# Imagem oficial da Apache: https://hub.docker.com/r/apache/kafka
#
# Os scripts Python rodam no host (fora do Docker) e se conectam em
# localhost:9092. Por isso o endereco ANUNCIADO pelo Kafka e localhost:9092.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tde03-kafka
    ports:
      - "9092:9092"
    environment:
      # Este no e ao mesmo tempo broker e controller (KRaft)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Portas em que o Kafka escuta dentro do container
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Endereco que o Kafka "informa" aos clientes Python no host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # Como so existe 1 no, tudo com fator de replicacao 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topicos novos nascem com 1 particao (mantem a ordem das mensagens)
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  kafka-data:
